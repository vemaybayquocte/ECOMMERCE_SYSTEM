apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  namespace: ecommerce
data:
  PORT: '3000'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  AUTH_SERVICE_URL: http://auth-service:3004
  ORDER_SERVICE_URL: http://order-service:3001
  PAYMENT_SERVICE_URL: http://payment-service:3002
  INVENTORY_SERVICE_URL: http://inventory-service:3003
  CATALOG_SERVICE_URL: http://catalog-service:3005
  THROTTLE_TTL_MS: '60000'
  THROTTLE_LIMIT: '100'
  REDIS_URL: redis://redis:6379
  PROXY_TIMEOUT_MS: '15000'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: gateway-service-config
          resources:
            requests: { memory: '150Mi', cpu: '100m' }
            limits: { memory: '300Mi', cpu: '500m' }
          readinessProbe:
            # Default timeoutSeconds is 1s - too tight now that /health goes
            # through the rate-limit middleware, which touches Redis on
            # every request. A command queued while the connection is
            # still (re)connecting can take longer than 1s to resolve even
            # though it succeeds - without slack here the probe kills the
            # pod before the connection ever gets a chance to stabilize.
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 8
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: ecommerce
spec:
  selector:
    app: gateway-service
  ports:
    - port: 3000
      targetPort: 3000
