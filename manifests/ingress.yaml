apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
spec:
  ingressClassName: nginx
  rules:
    - host: ecommerce.local
      http:
        paths:
          # gateway-service is now the single entry point: it reverse-proxies
          # /auth, /orders, /payments, /inventory to the internal services
          # and applies rate limiting uniformly. Nothing else should be
          # routed to the backend services directly anymore.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
