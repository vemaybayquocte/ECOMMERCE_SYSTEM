# Headless service: gives each pod a stable DNS name
# (zookeeper-N.zookeeper-headless.ecommerce.svc.cluster.local) so ensemble
# members can find each other, and so Kafka can list all 3 explicitly
# instead of depending on a single load-balanced ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: ecommerce
spec:
  clusterIP: None
  # Without this, the EndpointSlice controller only publishes a pod's DNS
  # record once it's Ready - but a ZK pod can't become Ready until it can
  # resolve its OWN hostname to bind its quorum listener (and its peers',
  # to reach them for election). That's a real deadlock, not a transient
  # DNS-propagation race: a not-yet-Ready pod can never publish the record
  # it needs to become Ready in the first place.
  publishNotReadyAddresses: true
  selector:
    app: zookeeper
  ports:
    - { name: client, port: 2181, targetPort: 2181 }
    - { name: peer, port: 2888, targetPort: 2888 }
    - { name: leader-election, port: 3888, targetPort: 3888 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: ecommerce
spec:
  serviceName: zookeeper-headless
  replicas: 3
  # The default OrderedReady policy waits for zookeeper-0 to become Ready
  # before even creating zookeeper-1 - but zookeeper-0 can't become Ready
  # without a quorum of peers already reachable, and those peers don't
  # exist yet. Parallel creates all 3 at once so they can actually form
  # quorum together.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      # See kafka.yaml: K8s auto-injects <SERVICE>_PORT-style env vars that
      # can collide with Confluent images' own legacy config vars.
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.3
          ports:
            - containerPort: 2181
            - containerPort: 2888
            - containerPort: 3888
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: '2181'
            - name: ZOOKEEPER_TICK_TIME
              value: '2000'
            - name: ZOOKEEPER_INIT_LIMIT
              value: '5'
            - name: ZOOKEEPER_SYNC_LIMIT
              value: '2'
            # All 3 ensemble members, by stable per-pod DNS name from the
            # headless service above. Semicolon-separated, NOT comma - the
            # Confluent config script treats the whole comma-separated
            # string as one value (produced a single "server.1=a,b,c" line
            # instead of 3 separate server.N lines), and an earlier
            # semicolon-per-entry client-port suffix (";2181") shifted
            # every field over by one and produced 4 corrupt lines. Neither
            # error surfaced anywhere in the container's stdout - the
            # process just hung at "Configuring ..." forever.
            - name: ZOOKEEPER_SERVERS
              value: 'zookeeper-0.zookeeper-headless:2888:3888;zookeeper-1.zookeeper-headless:2888:3888;zookeeper-2.zookeeper-headless:2888:3888'
            - name: KAFKA_HEAP_OPTS
              value: '-Xmx256M -Xms256M'
          # ZOOKEEPER_SERVER_ID must be unique per ensemble member (1-3).
          # StatefulSet pods get a stable ordinal suffix (zookeeper-0/1/2),
          # so we derive the ID from it instead of hardcoding per-pod config.
          command:
            - sh
            - -exc
            - |
              export ZOOKEEPER_SERVER_ID=$((${HOSTNAME##*-} + 1))
              exec /etc/confluent/docker/run
          readinessProbe:
            tcpSocket: { port: 2181 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          # Requests trimmed below the JVM's actual idle footprint (~250Mi)
          # so 3 replicas fit on a single-node Minikube cluster alongside
          # Kafka/RabbitMQ's own 3x multiplier - limits stay generous since
          # only requests affect scheduling, not runtime enforcement.
          resources:
            requests: { memory: '192Mi', cpu: '100m' }
            limits: { memory: '450Mi', cpu: '500m' }
          volumeMounts:
            # Covers both ZOOKEEPER_DATA_DIR (/var/lib/zookeeper/data) and
            # ZOOKEEPER_LOG_DIR (/var/lib/zookeeper/log) - both are
            # subdirectories of this single mount. Without this, a pod
            # restart wipes the ensemble member's local state entirely
            # (relying only on the other 2 members to bring it back up to
            # date), which is a real data-loss risk if more than one
            # member is down/restarting at once - not just theoretical,
            # since Kafka can't function without ZK quorum either.
            - name: data
              mountPath: /var/lib/zookeeper
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: ecommerce
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
