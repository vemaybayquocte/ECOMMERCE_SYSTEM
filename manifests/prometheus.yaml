apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: ecommerce
data:
  alerts.yml: |
    groups:
      - name: ecommerce
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: '{{ $labels.job }} is down'
              description: 'Prometheus has not been able to scrape {{ $labels.job }} for 2 minutes.'

          - alert: HighErrorRate
            expr: |
              sum by (job) (rate(http_requests_total{status_code=~"5.."}[5m]))
              /
              sum by (job) (rate(http_requests_total[5m]))
              > 0.1
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: '{{ $labels.job }} has a high 5xx error rate'
              description: 'More than 10% of requests to {{ $labels.job }} have returned 5xx over the last 5 minutes.'

          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))
              > 1
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: '{{ $labels.job }} p95 latency is above 1s'
              description: 'p95 request latency for {{ $labels.job }} has been above 1 second for 5 minutes.'

          - alert: RabbitMQQueueBacklogGrowing
            expr: rabbitmq_queue_messages_ready > 100
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: 'Queue {{ $labels.queue }} has a growing backlog'
              description: 'Queue {{ $labels.queue }} has had more than 100 ready messages for 5 minutes - a consumer may be stuck or too slow.'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - /etc/prometheus/rules/alerts.yml

    scrape_configs:
      - job_name: order-service
        metrics_path: /metrics
        static_configs:
          - targets: ['order-service:3001']
      - job_name: payment-service
        metrics_path: /metrics
        static_configs:
          - targets: ['payment-service:3002']
      - job_name: inventory-service
        metrics_path: /metrics
        static_configs:
          - targets: ['inventory-service:3003']
      - job_name: auth-service
        metrics_path: /metrics
        static_configs:
          - targets: ['auth-service:3004']
      - job_name: catalog-service
        metrics_path: /metrics
        static_configs:
          - targets: ['catalog-service:3005']
      - job_name: notification-service
        metrics_path: /metrics
        static_configs:
          - targets: ['notification-service:3006']
      - job_name: gateway-service
        metrics_path: /metrics
        static_configs:
          - targets: ['gateway-service:3000']
      - job_name: rabbitmq
        metrics_path: /metrics
        static_configs:
          - targets: ['rabbitmq:15692']
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
          resources:
            requests: { memory: '200Mi', cpu: '100m' }
            limits: { memory: '400Mi', cpu: '500m' }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ecommerce
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
