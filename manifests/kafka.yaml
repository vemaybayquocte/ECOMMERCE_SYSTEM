# Headless service: gives each broker a stable DNS name
# (kafka-N.kafka-headless.ecommerce.svc.cluster.local) so KAFKA_BROKER_ID
# and KAFKA_ADVERTISED_LISTENERS can be derived per-pod instead of assuming
# a single shared hostname.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: ecommerce
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ecommerce
spec:
  serviceName: kafka-headless
  replicas: 3
  # See zookeeper.yaml for why: brokers don't need each other Ready to
  # start (only Zookeeper reachable), so there's no deadlock risk here,
  # but Parallel still gets all 3 up at once instead of one at a time.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Kubernetes auto-injects Docker-links-style env vars for every
      # Service into every pod (e.g. KAFKA_PORT=tcp://<ip>:9092 for a
      # Service named "kafka"). That name collides exactly with
      # Confluent's own legacy KAFKA_PORT config var, so the broker tries
      # to parse the K8s-injected URL as a port number and crashes on
      # startup. Disabling service-links avoids the collision; we don't
      # need it anyway since every hostname here is resolved via K8s DNS.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.3
          ports:
            - containerPort: 9092
          env:
            # Plain ClusterIP service, not an explicit per-pod list: this
            # image's "zk-ready" preflight script word-splits a
            # comma-separated multi-host value into separate shell
            # arguments and crashes ("unrecognized arguments") - it only
            # accepts a single host:port. The zookeeper Service already
            # load-balances across all 3 ensemble members, so a broker
            # still doesn't depend on any one specific Zookeeper pod.
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: 'zookeeper:2181'
            - name: KAFKA_LISTENERS
              value: 'PLAINTEXT://0.0.0.0:9092'
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: 'PLAINTEXT:PLAINTEXT'
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: 'PLAINTEXT'
            # 3 brokers, so the offsets topic and any auto-created topic
            # (e.g. the outbox event topic) survive one broker going down
            # instead of only ever having a single copy.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: '3'
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: '3'
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: '0'
            # Cap the JVM heap explicitly: without this the broker sizes its
            # heap off the node's total memory rather than this pod's limit,
            # which starved the rest of the cluster and caused repeated OOM
            # kills on a resource-constrained Minikube node.
            - name: KAFKA_HEAP_OPTS
              value: '-Xmx512M -Xms512M'
          # KAFKA_BROKER_ID and KAFKA_ADVERTISED_LISTENERS are per-broker:
          # StatefulSet pods get a stable ordinal suffix (kafka-0/1/2), so
          # both are derived from it instead of hardcoding 3 near-duplicate
          # manifests.
          command:
            - sh
            - -exc
            - |
              export KAFKA_BROKER_ID=${HOSTNAME##*-}
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless:9092"
              exec /etc/confluent/docker/run
          resources:
            requests: { memory: '640Mi', cpu: '250m' }
            limits: { memory: '900Mi', cpu: '1' }
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecommerce
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
