apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Kubernetes auto-injects Docker-links-style env vars for every
      # Service into every pod (e.g. KAFKA_PORT=tcp://<ip>:9092 for a
      # Service named "kafka"). That name collides exactly with
      # Confluent's own legacy KAFKA_PORT config var, so the broker tries
      # to parse the K8s-injected URL as a port number and crashes on
      # startup. Disabling service-links avoids the collision; we don't
      # need it anyway since every hostname here is resolved via K8s DNS.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.3
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: '1'
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: 'zookeeper:2181'
            # Single internal listener: everything that talks to Kafka here
            # (order-service, debezium-connect) runs inside the cluster, so
            # there's no need for the dual host/container listener setup
            # used in the local docker-compose stack.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: 'PLAINTEXT://kafka:9092'
            - name: KAFKA_LISTENERS
              value: 'PLAINTEXT://0.0.0.0:9092'
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: 'PLAINTEXT:PLAINTEXT'
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: 'PLAINTEXT'
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: '0'
            # Cap the JVM heap explicitly: without this the broker sizes its
            # heap off the node's total memory rather than this pod's limit,
            # which starved the rest of the cluster and caused repeated OOM
            # kills on a resource-constrained Minikube node.
            - name: KAFKA_HEAP_OPTS
              value: '-Xmx512M -Xms512M'
          resources:
            requests: { memory: '640Mi', cpu: '250m' }
            limits: { memory: '900Mi', cpu: '1' }
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecommerce
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
