# NOTE: dummy dev credentials for a local Minikube cluster only.
# Never commit real production secrets to Git this way; use Sealed Secrets /
# External Secrets / SOPS for a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: ecommerce
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
  # Shared across all 3 cluster nodes - RabbitMQ nodes can only join the
  # same Erlang cluster if they present the same cookie.
  RABBITMQ_ERLANG_COOKIE: dev-erlang-cookie-change-me-in-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
# Shared across every service that signs or verifies JWTs (auth-service
# signs, order-service/gateway-service verify) - stateless verification
# only works if they all agree on this same secret.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: ecommerce
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me-in-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
