apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 5
  # Default scaleUp stabilization is 0s - reacts to a single sample. On a
  # single-node Minikube cluster, a CPU blip from unrelated pods (the
  # messaging-tier StatefulSets forming/restarting) briefly inflates every
  # container's measured CPU%, since it's all sharing one node's real
  # cores - not a signal this service's own load actually grew. Without a
  # window, that one noisy sample triggered a scale-to-max on all 3
  # HPA-managed services simultaneously, which then contended for the
  # same constrained memory RabbitMQ/Kafka/Zookeeper needed to schedule -
  # a real feedback loop observed directly on this cluster.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 90
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
