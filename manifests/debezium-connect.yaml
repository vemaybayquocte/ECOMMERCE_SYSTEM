apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      containers:
        - name: debezium-connect
          image: debezium/connect:2.5
          ports:
            - containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: 'kafka:9092'
            - name: GROUP_ID
              value: 'debezium-connect-cluster'
            - name: CONFIG_STORAGE_TOPIC
              value: 'debezium_connect_configs'
            - name: OFFSET_STORAGE_TOPIC
              value: 'debezium_connect_offsets'
            - name: STATUS_STORAGE_TOPIC
              value: 'debezium_connect_status'
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: '1'
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: '1'
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_HEAP_OPTS
              value: '-Xmx512M -Xms512M'
          resources:
            requests: { memory: '640Mi', cpu: '250m' }
            limits: { memory: '900Mi', cpu: '1' }
          readinessProbe:
            httpGet: { path: /, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: ecommerce
spec:
  selector:
    app: debezium-connect
  ports:
    - port: 8083
      targetPort: 8083
