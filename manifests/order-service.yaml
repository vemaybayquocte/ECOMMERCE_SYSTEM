apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: ecommerce
data:
  PORT: '3001'
  DB_HOST: order-db
  DB_PORT: '5432'
  DB_NAME: order_db
  RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
  RABBITMQ_EXCHANGE: ecommerce.events
  KAFKA_BROKERS: kafka:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: order-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: order-db-secret, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: order-db-secret, key: POSTGRES_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  { name: order-service-auth-secret, key: JWT_SECRET }
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  { name: order-service-auth-secret, key: DEMO_API_KEY }
          resources:
            requests: { memory: '200Mi', cpu: '100m' }
            limits: { memory: '400Mi', cpu: '500m' }
          # order-service's outbox relay joins a Kafka consumer group at
          # startup, which can take 20-30s — probes are timed accordingly
          # so a slow-but-healthy boot isn't mistaken for a crash.
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  selector:
    app: order-service
  ports:
    - port: 3001
      targetPort: 3001
