apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: ecommerce
data:
  PORT: '3002'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  DB_HOST: payment-db
  DB_PORT: '5432'
  DB_NAME: payment_db
  RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
  RABBITMQ_EXCHANGE: ecommerce.events
  RABBITMQ_PREFETCH_COUNT: '10'
  PAYMENT_TRANSIENT_FAILURE_RATE: '0.2'
  PAYMENT_GATEWAY_TIMEOUT_MS: '2000'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: payment-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: payment-db-secret, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: payment-db-secret, key: POSTGRES_PASSWORD }
          resources:
            requests: { memory: '200Mi', cpu: '100m' }
            limits: { memory: '400Mi', cpu: '500m' }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ecommerce
spec:
  selector:
    app: payment-service
  ports:
    - port: 3002
      targetPort: 3002
