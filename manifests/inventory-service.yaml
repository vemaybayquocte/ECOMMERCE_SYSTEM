apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-config
  namespace: ecommerce
data:
  PORT: '3003'
  DB_HOST: inventory-db
  DB_PORT: '5432'
  DB_NAME: inventory_db
  RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
  RABBITMQ_EXCHANGE: ecommerce.events
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: inventory-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: inventory-db-secret, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: inventory-db-secret, key: POSTGRES_PASSWORD }
          resources:
            requests: { memory: '200Mi', cpu: '100m' }
            limits: { memory: '400Mi', cpu: '500m' }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  selector:
    app: inventory-service
  ports:
    - port: 3003
      targetPort: 3003
