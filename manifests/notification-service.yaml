apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: ecommerce
data:
  PORT: '3006'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
  RABBITMQ_EXCHANGE: ecommerce.events
  RABBITMQ_PREFETCH_COUNT: '10'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: notification-service-config
          resources:
            requests: { memory: '150Mi', cpu: '100m' }
            limits: { memory: '300Mi', cpu: '500m' }
          readinessProbe:
            httpGet: { path: /health, port: 3006 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3006 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - port: 3006
      targetPort: 3006
