# Backs the gateway's distributed rate limiter - a single replica is
# intentional here (not HA): it only holds short-lived rate-limit
# counters, a second replica would just be a second, disagreeing counter
# store without Redis Cluster/Sentinel, and the gateway is coded to
# fail-open if this is unreachable (see gateway-service's REDIS_URL
# usage) so this is deliberately not a critical-path dependency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ''
          ports:
            - containerPort: 6379
          # No auth (matches this cluster's existing dev-only secrets
          # posture, see secrets.yaml) and no PVC (--save "" above means
          # nothing to persist - a restart just resets rate-limit windows).
          resources:
            requests: { memory: '32Mi', cpu: '25m' }
            limits: { memory: '96Mi', cpu: '200m' }
          readinessProbe:
            # Default timeoutSeconds is 1s. exec probes fork+exec a real
            # process inside the container (redis-cli ping) - under any
            # real CPU contention on the node that alone can exceed 1s
            # even though Redis itself is perfectly healthy and would
            # have answered fine. Without slack here the liveness probe
            # kills and restarts Redis in a loop based on scheduling
            # latency, not actual health - this was observed directly on
            # this cluster (10 restarts from probe timeouts, not crashes).
            exec: { command: ['redis-cli', 'ping'] }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec: { command: ['redis-cli', 'ping'] }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecommerce
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
