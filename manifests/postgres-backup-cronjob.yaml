# Daily pg_dump backup for each service DB. A real deployment would ship
# these to S3/GCS; on a local single-node cluster the closest useful
# equivalent is a PVC that survives pod/node restarts, with old dumps
# rotated out so the volume doesn't grow unbounded.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups-pvc
  namespace: ecommerce
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: order-db-backup
  namespace: ecommerce
spec:
  schedule: '0 2 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: order-db-secret, key: POSTGRES_PASSWORD }
              command:
                - sh
                - -c
                - |
                  set -e
                  mkdir -p /backups/order-db
                  pg_dump -h order-db -U postgres -d order_db \
                    -f "/backups/order-db/order_db-$(date +%Y%m%d-%H%M%S).sql"
                  # keep the 7 most recent dumps, drop the rest
                  cd /backups/order-db && ls -1t *.sql | tail -n +8 | xargs -r rm --
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: db-backups-pvc
---
