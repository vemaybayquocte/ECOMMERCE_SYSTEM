apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vemaybayquocte/ECOMMERCE_SYSTEM.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
